<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Priorities V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="DP.svg">
<style>
:root{--bg:#2e2e2e;--line:#e6e6e6;--text:#2b2b2b;
--cols:minmax(130px,1.2fr) minmax(200px,2.6fr) minmax(110px,1.1fr) 116px 70px 110px minmax(160px,1.4fr);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:'Outfit',system-ui,sans-serif;font-size:17px;font-weight:500}
main{max-width:1280px;margin:0 auto;padding:48px 24px 80px}
h1{text-align:center;font-weight:800;font-size:40px;margin:0 0 56px}
label.t{display:block;font-weight:700;margin-bottom:10px}
.add{display:flex;gap:32px;align-items:stretch;margin-bottom:56px}
.fields{flex:1;display:flex;border-radius:24px;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.fields>*{background:transparent;color:#fff;border:0;border-right:2px solid var(--line);padding:11px 16px;font:inherit;min-width:0;color-scheme:dark}
.fields>*:last-child{border-right:0}
.fields input[name=client]{flex:1.2}.fields input[name=name]{flex:2.6}.fields input[name=manager]{flex:1.3}
.fields .md{flex:1}.fields input[type=time]{flex:.8}
.fields ::placeholder{color:#7d7d7d}
.fields select:invalid{color:#7d7d7d}
.fields option{color:#000}
.cblist{position:fixed;z-index:60;background:#d9d9d9;color:#2b2b2b;border-radius:18px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);overflow-y:auto;font:500 17px 'Outfit',system-ui,sans-serif}
.cbo,.cbno{padding:9px 14px;border-radius:12px;cursor:pointer}
.cbo.on{background:rgba(0,0,0,.12)}
.cbno{color:#6a6a6a;cursor:default}
.asapf{display:flex;align-items:center;gap:10px;white-space:nowrap}
button.go{background:#e0e0e0;color:#2b2b2b;border:0;border-radius:24px;padding:0 64px;font:inherit;font-weight:800;font-size:22px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid currentColor;background:none;cursor:pointer;flex:none;border-radius:2px}
.chk:checked{background:linear-gradient(to top right,transparent 45%,currentColor 45% 55%,transparent 55%),linear-gradient(to bottom right,transparent 45%,currentColor 45% 55%,transparent 55%)}
#msg{min-height:24px;margin:-36px 0 24px;color:#f0a38c}
.admin{display:flex;flex-direction:column;gap:32px;margin:0 0 48px;padding:0 16px}
.stats,.searches{display:flex;align-items:center;flex-wrap:wrap;gap:16px 44px}
.searches{gap:16px 32px}
.admin .stats,.admin .wl{display:none}
.admin.on .stats,.admin.on .wl{display:flex}
.st{color:#7d7d7d}
.st b{color:#fff;font-weight:700;margin-left:8px}
.search{flex:1 1 200px;max-width:320px;display:flex;align-items:center;gap:8px;border-radius:24px;box-shadow:inset 0 0 0 2px var(--line);padding:7px 16px}
.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;padding:0;outline:0}
.search input::placeholder{color:#7d7d7d}
.search button{background:none;border:0;color:#fff;padding:0;display:flex;cursor:pointer}
.wl{display:flex;align-items:center;flex-wrap:wrap;gap:8px 22px;flex:none}
#wl{display:flex;gap:22px}
.d{color:#e6e6e6;font-weight:700;white-space:nowrap}
.d .tot{color:#7d7d7d;font-weight:500;margin-left:6px}
.d .g{color:#3ecf70}.d .y{color:#f2e04a}.d .r{color:#e04b4b}
.wrap{overflow-x:auto}
.table.adm{padding-right:44px}
.rowswrap{position:relative}
.dels{position:absolute;left:100%;top:0;margin-left:10px;width:30px}
.del{position:absolute;left:0;width:30px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:#d64545;cursor:pointer}
.del:hover{color:#ff6b6b}
.pop{position:fixed;z-index:50;background:#d9d9d9;color:#2b2b2b;border-radius:28px;padding:22px 28px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-weight:800;font-size:19px;width:max-content;max-width:calc(100vw - 24px)}
.pop .ask{margin:0 0 18px}
.pop .btns{display:flex;justify-content:space-between;gap:36px}
.pop button{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer}
.pop .yes svg{color:#d64545}.pop .no svg{color:#2fc462}
.table{min-width:1000px}
.head,.row{display:grid;grid-template-columns:var(--cols);align-items:stretch}
.head{box-shadow:inset 0 0 0 2px var(--line);border-radius:22px;font-weight:700;margin-bottom:4px}
.head>*,.row>*{padding:8px 14px;display:flex;align-items:center;min-height:36px;min-width:0}
.head>*{padding-top:10px;padding-bottom:10px}
.rows{position:relative;background:#d9d9d9;min-height:420px;border-radius:22px;overflow:hidden;color:var(--text);display:flex;flex-direction:column;gap:3px}
.row{flex:none}
.row>*:nth-child(odd){background:rgba(0,0,0,.07)}
.head>*:nth-child(5),.row>*:nth-child(5){justify-content:center;padding-left:0;padding-right:0}
.row.asap{background:#000;color:#fff}
.row.asap>*{background:none!important}
.row.done{background:#cfcfcf;color:#8d8d8d}
.row .chk{border-color:currentColor}
.md{display:flex;align-items:center;gap:6px;position:relative;min-width:0;width:100%}
.md input[type=text]{background:transparent;border:0;color:inherit;font:inherit;padding:0;min-width:0;width:100%}
.md .cal{background:none;border:0;color:inherit;padding:0;display:flex;cursor:pointer;opacity:.75;flex:none}
.md .pk{position:absolute;left:0;bottom:0;width:0;height:0;opacity:0;border:0;padding:0;pointer-events:none}
.editable{cursor:pointer}
.editable:hover{outline:2px solid rgba(0,0,0,.25);outline-offset:-2px}
.row input[type=text],.row input[type=time],.row select{font:inherit;color:inherit;background:transparent;border:0;width:100%;padding:0;margin:0;color-scheme:light}
.row.asap input,.row.asap select{color-scheme:dark}
.row select{appearance:none;-webkit-appearance:none;cursor:pointer}
.row option{color:#000}
.empty{padding:28px;text-align:center;color:#6a6a6a}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-width:760px){
 .add{flex-direction:column;gap:16px}
 .fields{flex-direction:column;border-radius:20px}
 .fields>*{border-right:0;border-bottom:2px solid var(--line)}
 button.go{padding:14px}
 h1{font-size:30px}
}
</style>
</head>
<body>
<main>
<h1>DESIGN PRIORITIES V3</h1>

<label class="t" for="f-client">Új projekt:</label>
<form class="add" id="form">
 <div class="fields">
  <input name="client" id="f-client" placeholder="Kliens" required autocomplete="off" role="combobox" aria-autocomplete="list" aria-label="Kliens">
  <input name="name" placeholder="Projekt elnevezése" required aria-label="Projekt elnevezése">
  <input name="manager" placeholder="Content manager" required aria-label="Content manager">
  <span id="dl-slot"></span>
  <input name="time" type="time" aria-label="Óra (ha van)" title="Óra (ha van)">
  <label class="asapf">ASAP <input class="chk" type="checkbox" name="asap"></label>
 </div>
 <button class="go" id="go" type="submit">MEHET</button>
</form>
<div id="msg" role="status"></div>

<div class="admin" id="admin">
 <div class="stats">
  <span class="st">Összes projekt a hónapban: <b id="s-month">0</b></span>
  <span class="st">Hátra van még: <b id="s-left">0</b></span>
  <span class="st">Top kliens a hónapban: <b id="s-top">–</b></span>
 </div>
 <div class="searches">
  <div class="search">
   <input id="q-p" type="text" placeholder="Projekt keresés" aria-label="Keresés a projektek elnevezésében" autocomplete="off">
   <button type="button" id="qx-p" aria-label="Keresés"></button>
  </div>
  <div class="search">
   <input id="q-c" type="text" placeholder="Kliens keresés" aria-label="Keresés a kliensek között" autocomplete="off">
   <button type="button" id="qx-c" aria-label="Keresés"></button>
  </div>
  <div class="wl"><span class="st">Workload /day:</span><span id="wl"></span></div>
 </div>
</div>

<div class="wrap"><div class="table">
 <div class="head"><div>Kliens</div><div>Projekt elnevezése</div><div>CM</div><div>Határidő</div><div>ASAP</div><div>Óra</div><div>Státusz</div></div>
 <div class="rowswrap"><div class="rows" id="rows"></div><div class="dels" id="dels"></div></div>
</div></div>
</main>

<script>
const API='https://script.google.com/macros/s/AKfycbz6E4Di2zPn5YbH8gYrzPm3nUysrlq6MG9Ej8bhmpoDGxk723oLANi_KQV_VgUrV8aR/exec';
const ADMIN=new URLSearchParams(location.search).get('admin')||'';
const STATUSES=['Még nem kezdtem el','Folyamatban','Kész'];
let state={clients:[],tasks:[]};
const $=s=>document.querySelector(s);
const say=t=>{$('#msg').textContent=t||''};

function daysUntil(iso){
  const [y,m,d]=iso.split('-').map(Number), n=new Date();
  return Math.round((new Date(y,m-1,d)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
}
const short=iso=>{const p=(iso||'').split('-');return p.length===3?p[1]+'.'+p[2]:''};
const key=t=>(t.deadline||'9999')+' '+(t.time||'99:99');
const sorted=()=>[...state.tasks].sort((a,b)=>{
  const x=a.status==='Kész',y=b.status==='Kész';
  return x!==y?(x?1:-1):key(a).localeCompare(key(b));
});

async function post(data){
  const r=await fetch(API,{method:'POST',body:JSON.stringify(data)});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'error');
}
async function update(t,changes){
  Object.assign(t,changes); render();
  try{ await post({action:'update',id:t.id,code:ADMIN,...changes}); say(''); }
  catch(e){ say(e.message==='wrong code'?'Hibás admin kód, a státusz nem változott.':'Nem sikerült menteni. Próbáld újra.'); load(); }
}

function cell(row,text){const c=document.createElement('div');c.textContent=text||'';row.append(c);return c}

const pad=n=>String(n).padStart(2,'0');
const CAL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

function parseMD(str,ref){
  const m=str.trim().match(/^(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\.?$/);
  if(!m) return '';
  const mo=+m[1], da=+m[2], now=new Date();
  let y=ref?+ref.slice(0,4):now.getFullYear();
  if(!ref && (new Date(y,mo-1,da)-now)/864e5<-60) y++;
  const d=new Date(y,mo-1,da);
  return d.getMonth()===mo-1&&d.getDate()===da?y+'-'+pad(mo)+'-'+pad(da):'';
}

function mdField(iso,ref){
  const box=document.createElement('span'); box.className='md';
  const t=document.createElement('input'); t.type='text'; t.placeholder='hh.nn'; t.maxLength=6;
  t.inputMode='numeric'; t.value=short(iso); t.setAttribute('aria-label','Határidő (hónap.nap)');
  const b=document.createElement('button'); b.type='button'; b.className='cal'; b.innerHTML=CAL; b.setAttribute('aria-label','Naptár');
  const p=document.createElement('input'); p.type='date'; p.className='pk'; p.tabIndex=-1;
  let cur=iso||'';
  const api={box,text:t,onpick:null,get:()=>cur,clear:()=>{cur='';t.value='';t.setCustomValidity('')}};
  t.addEventListener('input',()=>{ cur=parseMD(t.value,ref); t.setCustomValidity(t.value&&!cur?'Add meg így: hh.nn (pl. 11.05)':''); });
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{ p.value=cur; try{p.showPicker()}catch(e){p.click()} });
  p.addEventListener('change',()=>{ if(!p.value) return; cur=p.value; t.value=short(cur); t.setCustomValidity(''); if(api.onpick) api.onpick(); });
  box.append(t,b,p); return api;
}

function editable(c,t,field,type){
  c.classList.add('editable'); c.tabIndex=0; c.title='Kattints a módosításhoz';
  const open=()=>{
    if(c.querySelector('input,select')) return;
    let el,get,md;
    c.textContent='';
    if(type==='client'){
      el=document.createElement('select');
      for(const o of (state.clients.includes(t.client)?state.clients:[t.client,...state.clients])) el.add(new Option(o,o));
      el.value=t.client; get=()=>el.value; c.append(el);
    }else if(type==='date'){
      md=mdField(t.deadline,t.deadline); el=md.text; get=md.get; c.append(md.box);
    }else{
      el=document.createElement('input'); el.type=type; el.value=t[field]||''; get=()=>el.value; c.append(el);
    }
    el.focus();
    let done=false;
    const fin=ok=>{
      if(done) return; done=true;
      const v=get();
      if(ok && (v||field==='time'||field==='asap') && v!==(t[field]||'')) update(t,{[field]:v}); else render();
    };
    if(type==='client'||type==='time') el.addEventListener('change',()=>fin(true));
    if(md) md.onpick=()=>fin(true);
    c.addEventListener('focusout',e=>{ if(!c.contains(e.relatedTarget)) fin(true); });
    c.addEventListener('keydown',e=>{ if(e.key==='Enter') fin(true); if(e.key==='Escape') fin(false); });
  };
  c.addEventListener('click',open);
  c.addEventListener('keydown',e=>{ if(e.key==='Enter') open(); });
}

const MAG='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const XIC='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const qs={p:'',c:''};

const WL=['M','T','W','T','F'];
function weekDays(){
  const n=new Date(), d=new Date(n.getFullYear(),n.getMonth(),n.getDate()), wd=d.getDay();
  d.setDate(d.getDate()+(wd===0?1:wd===6?2:1-wd));
  return [0,1,2,3,4].map(i=>{const x=new Date(d); x.setDate(d.getDate()+i); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());});
}

const DELX='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 4l16 16M20 4L4 20"/></svg>';
const CHK='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M3 13l6 6L21 6"/></svg>';
const NOX='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M4 4l16 16M20 4L4 20"/></svg>';
let rowEls=[], pop=null;

function placeDels(){
  const box=$('#dels'); box.textContent='';
  if(!ADMIN) return;
  for(const [t,r] of rowEls){
    const b=document.createElement('button'); b.type='button'; b.className='del';
    b.title='Törlés'; b.setAttribute('aria-label','Törlés'); b.innerHTML=DELX;
    b.style.top=r.offsetTop+'px'; b.style.height=r.offsetHeight+'px';
    b.addEventListener('click',()=>askDelete(t,b));
    box.append(b);
  }
}
function closePop(){ if(pop){ pop.remove(); pop=null; } }
function askDelete(t,btn){
  closePop();
  pop=document.createElement('div'); pop.className='pop'; pop.setAttribute('role','dialog');
  pop.innerHTML='<p class="ask">Biztosan törölni akarod?</p><div class="btns"><button type="button" class="yes">'+CHK+'Igen</button><button type="button" class="no">'+NOX+'Nem</button></div>';
  document.body.append(pop);
  const r=btn.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  pop.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';
  pop.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px';
  pop.querySelector('.no').addEventListener('click',closePop);
  pop.querySelector('.yes').addEventListener('click',()=>{ closePop(); del(t); });
  pop.querySelector('.no').focus();
}
async function del(t){
  state.tasks=state.tasks.filter(x=>x.id!==t.id); render();
  try{ await post({action:'delete',id:t.id,code:ADMIN}); say(''); }
  catch(e){ say(e.message==='wrong code'?'Hibás admin kód, a törlés nem sikerült.':'Nem sikerült törölni. Próbáld újra.'); load(); }
}
document.addEventListener('mousedown',e=>{ if(pop&&!pop.contains(e.target)&&!e.target.closest('.del')) closePop(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePop(); });
window.addEventListener('resize',placeDels);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(placeDels);

function stats(){
  const n=new Date(), ym=n.getFullYear()+'-'+pad(n.getMonth()+1);
  const m=state.tasks.filter(t=>(t.deadline||'').startsWith(ym));
  $('#s-month').textContent=m.length;
  const cnt={}; for(const t of m) cnt[t.client]=(cnt[t.client]||0)+1;
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];
  $('#s-top').textContent=top?top[0]+' ('+top[1]+')':'–';
  $('#wl').innerHTML=weekDays().map((d,i)=>{
    const day=state.tasks.filter(t=>t.deadline===d);
    const n=day.filter(t=>t.status!=='Kész').length;
    return '<span class="d">'+WL[i]+': <b class="'+(n>15?'r':n>10?'y':'g')+'">'+n+'</b><span class="tot">('+day.length+')</span></span>';
  }).join('');
  $('#s-left').textContent=state.tasks.filter(t=>t.status!=='Kész').length;
}
function setQ(k,v){
  qs[k]=v; const b=$('#qx-'+k);
  b.innerHTML=v?XIC:MAG; b.setAttribute('aria-label',v?'Keresés törlése':'Keresés');
  render();
}

function render(){
  stats();
  const box=$('#rows'); box.textContent=''; rowEls=[];
  const np=norm(qs.p.trim()), nc=norm(qs.c.trim());
  const list=sorted().filter(t=>(!np||norm(t.name).includes(np))&&(!nc||norm(t.client).includes(nc)));
  if(!list.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=state.tasks.length?'Nincs találat.':'Még nincs projekt. Add hozzá fent.'; box.append(e); placeDels(); return; }
  for(const t of list){
    const r=document.createElement('div'); r.className='row';
    if(t.status==='Kész') r.classList.add('done');
    else if(t.asap) r.classList.add('asap');
    else if(t.deadline){
      const n=daysUntil(t.deadline);
      // red (older than yesterday) / orange (yesterday) / yellow (today) / yellow-green (tomorrow) / light green (2-4 days) / apple green (5+ days)
      const hue=n<=-2?12:n===-1?28:n===0?56:n===1?76:n<=4?96:118;
      r.style.background=`hsl(${hue} 52% 66%)`;
    }
    editable(cell(r,t.client),t,'client','client'); editable(cell(r,t.name),t,'name','text'); editable(cell(r,t.manager),t,'manager','text');
    editable(cell(r,short(t.deadline)),t,'deadline','date');
    const a=document.createElement('div'), cb=document.createElement('input');
    cb.type='checkbox'; cb.className='chk'; cb.checked=!!t.asap; cb.setAttribute('aria-label','ASAP');
    cb.addEventListener('change',()=>update(t,{asap:cb.checked})); a.append(cb); r.append(a);
    editable(cell(r,t.time),t,'time','time');
    const s=cell(r,'');
    if(ADMIN){
      const sel=document.createElement('select');
      for(const o of STATUSES){ const op=new Option(o,o); op.selected=o===t.status; sel.add(op); }
      sel.addEventListener('change',()=>update(t,{status:sel.value})); s.append(sel);
    } else s.textContent=t.status;
    box.append(r); rowEls.push([t,r]);
  }
  placeDels();
}

/* Kliens: type-to-filter dropdown in the new-project form */
const cbIn=$('#f-client');
let cbList=null, cbActive=-1, cbItems=[];
const canon=v=>state.clients.find(c=>norm(c)===norm((v||'').trim()))||'';
function cbValidate(){
  const v=cbIn.value.trim();
  cbIn.setCustomValidity(v&&!canon(v)?'Válassz egy klienst a listából.':'');
}
function cbMatches(){
  const n=norm(cbIn.value.trim()), all=state.clients;
  if(!n) return all;
  return [...all.filter(c=>norm(c).startsWith(n)),...all.filter(c=>!norm(c).startsWith(n)&&norm(c).includes(n))];
}
function cbPlace(){
  if(!cbList) return;
  const r=cbIn.getBoundingClientRect(), w=Math.max(r.width,260);
  const below=innerHeight-r.bottom-14, above=r.top-14;
  cbList.style.minWidth=w+'px';
  cbList.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  if(below<180&&above>below){ cbList.style.top=''; cbList.style.bottom=(innerHeight-r.top+6)+'px'; cbList.style.maxHeight=Math.min(280,above)+'px'; }
  else{ cbList.style.bottom=''; cbList.style.top=(r.bottom+6)+'px'; cbList.style.maxHeight=Math.min(280,below)+'px'; }
}
function cbSet(i,scroll){
  cbActive=i;
  const os=cbList?[...cbList.querySelectorAll('.cbo')]:[];
  os.forEach((o,k)=>o.classList.toggle('on',k===i));
  if(scroll&&os[i]) os[i].scrollIntoView({block:'nearest'});
}
function cbPick(c){ cbIn.value=c; cbValidate(); cbClose(); }
function cbClose(){ if(cbList){ cbList.remove(); cbList=null; } cbActive=-1; }
function cbOpen(){
  if(!cbList){ cbList=document.createElement('div'); cbList.className='cblist'; cbList.setAttribute('role','listbox'); document.body.append(cbList); }
  cbItems=cbMatches(); cbActive=-1; cbList.textContent='';
  if(!cbItems.length){ const e=document.createElement('div'); e.className='cbno'; e.textContent=state.clients.length?'Nincs találat':'Betöltés…'; cbList.append(e); }
  cbItems.forEach((c,i)=>{
    const o=document.createElement('div'); o.className='cbo'; o.setAttribute('role','option'); o.textContent=c;
    o.addEventListener('mousedown',e=>{ e.preventDefault(); cbPick(c); });
    o.addEventListener('mousemove',()=>{ if(cbActive!==i) cbSet(i,false); });
    cbList.append(o);
  });
  cbPlace();
}
cbIn.addEventListener('focus',cbOpen);
cbIn.addEventListener('click',()=>{ if(!cbList) cbOpen(); });
cbIn.addEventListener('input',()=>{ cbValidate(); cbOpen(); });
cbIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(!cbList) cbOpen(); cbSet(Math.min(cbItems.length-1,cbActive+1),true); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(cbList) cbSet(Math.max(0,cbActive-1),true); }
  else if(e.key==='Enter'){
    if(cbList&&cbItems.length&&(cbActive>=0||(cbIn.value.trim()&&!canon(cbIn.value)))){ e.preventDefault(); cbPick(cbItems[Math.max(0,cbActive)]); }
  }
  else if(e.key==='Escape') cbClose();
});
cbIn.addEventListener('blur',()=>{ const c=canon(cbIn.value); if(c) cbIn.value=c; cbValidate(); cbClose(); });
window.addEventListener('resize',cbPlace);
window.addEventListener('scroll',cbPlace,true);

function fillClients(){ cbValidate(); if(cbList) cbOpen(); }

async function load(){
  try{
    const r=await fetch(API); state=await r.json();
    fillClients(); render(); say('');
  }catch(e){ say('Nem sikerült betölteni az adatokat. Frissítsd az oldalt.'); }
}

const dd=mdField('','');
dd.text.required=true;
$('#dl-slot').replaceWith(dd.box);

$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target, b=$('#go');
  const d={action:'add',client:canon(f.client.value),name:f.name.value.trim(),manager:f.manager.value.trim(),
    deadline:dd.get(),time:f.time.value,asap:f.asap.checked};
  b.disabled=true; b.textContent='…';
  try{ await post(d); f.reset(); dd.clear(); cbValidate(); await load(); }
  catch(err){ say('Nem sikerült elküldeni. Próbáld újra.'); }
  b.disabled=false; b.textContent='MEHET';
});

for(const k of ['p','c']){
  $('#qx-'+k).innerHTML=MAG;
  $('#q-'+k).addEventListener('input',e=>setQ(k,e.target.value));
  $('#qx-'+k).addEventListener('click',()=>{ $('#q-'+k).value=''; setQ(k,''); $('#q-'+k).focus(); });
}
if(ADMIN){
  $('#admin').classList.add('on');
  document.querySelector('.table').classList.add('adm');
}

load();
setInterval(()=>{ if(!document.hidden && !document.querySelector('#rows input') && !cbList) load(); },60000);
</script>
